<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JulianaAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="sidebarMenu" class="sidebar">
        <div class="sidebar-header">
            <h3>Menu</h3>
            <button id="closeMenuBtn" class="close-btn">&times;</button>
        </div>
        <ul class="menu-items">
            <li><a href="#" id="newChatBtn" class="menu-link active">Nova Conversa</a></li>
            <li><a href="#" class="menu-link">Histórico</a></li>
            <li><a href="#" class="menu-link">Configurações</a></li>
        </ul>
    </div>
    <div id="menuOverlay" class="overlay"></div>

    <header>
        <div class="header-content">
            <button id="menuBtn" class="hamburger-btn">&#9776;</button>
            
            <div id="logoContainer" class="logo-container visible">
                <img src="img/logo.png" alt="JulianaAI" class="logo-img">
            </div>

            <div id="chatTitle" class="chat-title hidden"></div>
        </div>
    </header>

    <main class="chat-container">
        <div id="messages" class="messages"></div>

        <div class="input-area">
            <textarea id="messageInput" placeholder="Digite algo..." rows="1"></textarea>
            <button id="sendBtn">Enviar</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
