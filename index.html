<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <title>JulianaAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="sidebarMenu" class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">Juliana<span>AI</span></span>
            <button id="closeMenuBtn" class="close-btn">&times;</button>
        </div>
        
        <div class="sidebar-content">
            <p class="sidebar-label">Principal</p>
            <ul class="menu-items">
                <li><a href="#" id="newChatBtn" class="menu-link active"><span>+</span> Nova Conversa</a></li>
                <li><a href="#" class="menu-link"><span>🕒</span> Histórico</a></li>
                <ul id="historyList" class="menu-items"></ul>
            </ul>
        </div>

        <div class="sidebar-footer">
            <p>© 2026 JulianaAI</p>
        </div>
    </div>
    <div id="menuOverlay" class="overlay"></div>

    <header>
        <div class="header-content">
            <button id="menuBtn" class="hamburger-btn">&#9776;</button>
            <div id="logoContainer" class="logo-container">
                <img src="logo.png" alt="JulianaAI" class="logo">
            </div>
        </div>
    </header>

    <main class="chat-container">
        <div id="messages" class="messages"></div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="messageInput" placeholder="Digite algo..." rows="1"></textarea>
                <button id="sendBtn">Enviar</button>
            </div>
            <p class="ai-warning">Juliana é uma AI, talvez pode cometer erros</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
